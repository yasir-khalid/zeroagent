<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stream-chat · FastAPI LLM console</title>
<style>
  :root{
    --bg:#0b0e11; --bg2:#11161b; --panel:#141a20; --line:#222c35;
    --fg:#d7dee5; --dim:#7d8b97; --acc:#34d399; --acc2:#38bdf8;
    --user:#1b2630; --warn:#f59e0b; --err:#f87171;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, #11202b 0%, transparent 55%),
      var(--bg);
    color:var(--fg); font:14px/1.55 var(--mono);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 14px; background:var(--bg2);
    border-bottom:1px solid var(--line);
  }
  .brand{font-weight:700; letter-spacing:.5px; color:var(--fg); white-space:nowrap}
  .brand b{color:var(--acc)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:4px}
  .dot.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .dot.busy{background:var(--acc2);animation:pulse 1s infinite}
  .dot.err{background:var(--err)}
  @keyframes pulse{50%{opacity:.3}}
  input,select,button,textarea{font-family:var(--mono);font-size:13px}
  input,select{
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; outline:none;
  }
  input:focus,select:focus{border-color:var(--acc2)}
  #url{flex:1; min-width:220px}
  button{
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 11px; cursor:pointer; white-space:nowrap;
  }
  button:hover{border-color:var(--acc2); color:#fff}
  button.primary{background:var(--acc); color:#06241a; border-color:var(--acc); font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.4; cursor:not-allowed}
  .spacer{flex:1}
  .muted{color:var(--dim); font-size:12px}

  #log{flex:1; overflow-y:auto; padding:18px 14px; scroll-behavior:smooth}
  .msg{max-width:860px; margin:0 auto 14px; display:flex; gap:10px}
  .role{
    flex:0 0 64px; text-transform:uppercase; font-size:11px; letter-spacing:.5px;
    padding-top:2px; user-select:none;
  }
  .role.user{color:var(--acc2)}
  .role.assistant{color:var(--acc)}
  .role.system{color:var(--warn)}
  .role.error{color:var(--err)}
  .bubble{
    flex:1; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:10px 13px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.user .bubble{background:var(--user)}
  .msg.error .bubble{border-color:var(--err); color:#ffd9d9}
  .meta{font-size:11px; color:var(--dim); margin-top:6px; display:flex; gap:14px}
  .caret{display:inline-block;width:7px;height:15px;background:var(--acc);
    vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  footer{
    border-top:1px solid var(--line); background:var(--bg2);
    padding:10px 14px; display:flex; gap:10px; align-items:flex-end;
  }
  #input{
    flex:1; resize:none; min-height:42px; max-height:180px;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; outline:none; line-height:1.5;
  }
  #input:focus{border-color:var(--acc2)}
  .empty{max-width:860px;margin:60px auto;color:var(--dim);text-align:center}
  .empty code{color:var(--acc2)}
  details{max-width:860px;margin:0 auto 14px}
  summary{cursor:pointer;color:var(--dim);font-size:12px}
  .cfgrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .cfgrow label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
</style>
</head>
<body>
<header>
  <span class="brand">stream<b>·</b>chat</span>
  <span><span class="dot" id="status"></span><span class="muted" id="statusTxt">idle</span></span>
  <input id="url" placeholder="http://localhost:8000/chat" />
  <select id="fmt" title="response parsing">
    <option value="auto">auto-detect</option>
    <option value="openai">SSE · OpenAI delta</option>
    <option value="sse">SSE · data: text</option>
    <option value="raw">raw text chunks</option>
  </select>
  <button id="export">export ▾</button>
  <button id="clear">clear</button>
</header>

<div id="log">
  <details>
    <summary>request config</summary>
    <div class="cfgrow">
      <label>method
        <select id="method"><option>POST</option><option>GET</option></select>
      </label>
      <label>messages key
        <input id="msgKey" value="messages" style="width:120px">
      </label>
      <label>content path (json)
        <input id="contentPath" value="auto" style="width:160px" title="e.g. choices.0.delta.content — 'auto' tries common shapes">
      </label>
      <label style="flex-direction:row;align-items:center;gap:6px;margin-top:18px">
        <input type="checkbox" id="streamFlag" checked style="width:auto"> send "stream":true
      </label>
    </div>
  </details>
  <div class="empty" id="empty">
    point <code>endpoint URL</code> at your FastAPI stream and send a message.<br>
    everything is recorded in-browser — use <code>export</code> for JSON / JSONL / Markdown.
  </div>
</div>

<footer>
  <textarea id="input" placeholder="message…  (Enter to send · Shift+Enter newline)"></textarea>
  <button class="primary" id="send">send</button>
  <button id="stop" disabled>stop</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const logEl=$("#log"), emptyEl=$("#empty"), statusEl=$("#status"), statusTxt=$("#statusTxt");
let messages=[];          // [{role,content,ts,ms,firstTokenMs}]
let controller=null;

// ---- persistence (graceful: no-op if storage unavailable / sandboxed) ----
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const cfg={url:"#url",fmt:"#fmt",method:"#method",msgKey:"#msgKey",contentPath:"#contentPath"};
for(const [k,sel] of Object.entries(cfg)){const v=store.get("cfg."+k);if(v!=null)$(sel).value=v;
  $(sel).addEventListener("change",()=>store.set("cfg."+k,$(sel).value));}
$("#url").addEventListener("input",()=>store.set("cfg.url",$("#url").value));
$("#streamFlag").checked=store.get("cfg.stream",true);
$("#streamFlag").addEventListener("change",()=>store.set("cfg.stream",$("#streamFlag").checked));
messages=store.get("transcript",[]);
messages.forEach(m=>renderMsg(m));
if(messages.length) emptyEl.style.display="none";

function setStatus(state,txt){statusEl.className="dot"+(state?" "+state:"");statusTxt.textContent=txt}

// ---- rendering ----
function renderMsg(m){
  const row=document.createElement("div");
  row.className="msg "+m.role;
  row.innerHTML=`<div class="role ${m.role}">${m.role}</div><div class="bubble"></div>`;
  row.querySelector(".bubble").textContent=m.content;
  if(m.ms!=null||m.firstTokenMs!=null){
    const meta=document.createElement("div");meta.className="meta";
    if(m.firstTokenMs!=null)meta.innerHTML+=`<span>ttft ${m.firstTokenMs}ms</span>`;
    if(m.ms!=null)meta.innerHTML+=`<span>total ${m.ms}ms</span>`;
    meta.innerHTML+=`<span>~${Math.ceil((m.content||"").length/4)} tok</span>`;
    row.querySelector(".bubble").appendChild(meta);
  }
  logEl.appendChild(row);
  logEl.scrollTop=logEl.scrollHeight;
  return row.querySelector(".bubble");
}
const persist=()=>store.set("transcript",messages);

// ---- content extraction ----
function extract(obj,path){
  if(path&&path!=="auto"){return path.split(".").reduce((o,k)=>o==null?o:o[k.match(/^\d+$/)?+k:k],obj)}
  // auto: try common LLM streaming shapes
  return obj?.choices?.[0]?.delta?.content ??
         obj?.choices?.[0]?.text ??
         obj?.delta?.text ?? obj?.delta ??
         obj?.content ?? obj?.token ?? obj?.text ?? obj?.message?.content ?? null;
}

// ---- send ----
async function send(){
  const text=$("#input").value.trim(); if(!text||controller) return;
  emptyEl.style.display="none";
  const um={role:"user",content:text,ts:Date.now()};
  messages.push(um); renderMsg(um); persist();
  $("#input").value="";

  const url=$("#url").value.trim();
  if(!url){fail("no endpoint URL set");return}
  const method=$("#method").value, msgKey=$("#msgKey").value||"messages";
  const path=$("#contentPath").value.trim(), fmt=$("#fmt").value;

  const am={role:"assistant",content:"",ts:Date.now()};
  messages.push(am);
  const bubble=renderMsg(am);
  const caret=document.createElement("span");caret.className="caret";bubble.appendChild(caret);

  controller=new AbortController();
  $("#send").disabled=true;$("#stop").disabled=false;setStatus("busy","streaming…");
  const t0=performance.now();let first=null;

  try{
    const opts={method,signal:controller.signal,headers:{"Content-Type":"application/json"}};
    const payload={[msgKey]:messages.slice(0,-1).map(({role,content})=>({role,content}))};
    if($("#streamFlag").checked)payload.stream=true;
    if(method!=="GET")opts.body=JSON.stringify(payload);
    const res=await fetch(url,opts);
    if(!res.ok)throw new Error("HTTP "+res.status+" "+res.statusText);
    if(!res.body)throw new Error("no response body / streaming unsupported");

    const reader=res.body.getReader(),dec=new TextDecoder();let buf="";
    const useSSE=fmt==="openai"||fmt==="sse"||fmt==="auto";

    for(;;){
      const {value,done}=await reader.read(); if(done)break;
      const chunk=dec.decode(value,{stream:true});
      if(first==null){first=Math.round(performance.now()-t0)}

      if(fmt==="raw"){ append(chunk); continue; }
      buf+=chunk;
      // SSE events split on blank line
      let idx;
      while((idx=buf.indexOf("\n\n"))>=0){
        const evt=buf.slice(0,idx); buf=buf.slice(idx+2);
        for(let line of evt.split("\n")){
          line=line.trim(); if(!line||line.startsWith(":"))continue;
          if(line.startsWith("data:"))line=line.slice(5).trim();
          if(line==="[DONE]"){buf="";break}
          let piece=null;
          try{piece=extract(JSON.parse(line),path)}catch{piece=line}
          if(piece!=null)append(piece);
        }
      }
      if(!useSSE&&buf){append(buf);buf=""}
    }
    if(buf.trim()&&fmt!=="raw"){ // flush trailing non-terminated event
      try{const p=extract(JSON.parse(buf.replace(/^data:/,"").trim()),path);if(p)append(p)}catch{}
    }
    function append(s){am.content+=s;caret.remove();bubble.textContent=am.content;bubble.appendChild(caret);logEl.scrollTop=logEl.scrollHeight}

    am.ms=Math.round(performance.now()-t0); am.firstTokenMs=first;
    caret.remove();
    addMeta(bubble,am);
    setStatus("ok","done · "+am.ms+"ms");
  }catch(e){
    caret?.remove();
    if(e.name==="AbortError"){am.content+=" ⏹"; setStatus("","stopped")}
    else{messages.pop(); fail(e.message)}
  }finally{
    controller=null;$("#send").disabled=false;$("#stop").disabled=true;persist();
  }
}
function addMeta(bubble,m){
  const meta=document.createElement("div");meta.className="meta";
  if(m.firstTokenMs!=null)meta.innerHTML+=`<span>ttft ${m.firstTokenMs}ms</span>`;
  if(m.ms!=null)meta.innerHTML+=`<span>total ${m.ms}ms</span>`;
  meta.innerHTML+=`<span>~${Math.ceil((m.content||"").length/4)} tok</span>`;
  bubble.appendChild(meta);
}
function fail(msg){
  const em={role:"error",content:msg,ts:Date.now()};messages.push(em);renderMsg(em);persist();
  setStatus("err","error");
}

// ---- export ----
$("#export").addEventListener("click",()=>{
  const fmt=prompt("export format: json | jsonl | md","json"); if(!fmt)return;
  let data,mime,ext;
  const clean=messages.map(({role,content,ts,ms,firstTokenMs})=>({role,content,ts,ms,firstTokenMs}));
  if(fmt==="jsonl"){data=clean.map(m=>JSON.stringify(m)).join("\n");mime="application/x-ndjson";ext="jsonl"}
  else if(fmt==="md"){data=clean.map(m=>`**${m.role}** _(${new Date(m.ts).toISOString()})_\n\n${m.content}\n`).join("\n---\n\n");mime="text/markdown";ext="md"}
  else{data=JSON.stringify(clean,null,2);mime="application/json";ext="json"}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:mime}));
  a.download=`chat-${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.${ext}`;
  a.click();URL.revokeObjectURL(a.href);
});
$("#clear").addEventListener("click",()=>{
  if(messages.length&&!confirm("clear transcript?"))return;
  messages=[];persist();[...logEl.querySelectorAll(".msg")].forEach(e=>e.remove());
  emptyEl.style.display="";setStatus("","idle");
});
$("#send").addEventListener("click",send);
$("#stop").addEventListener("click",()=>controller?.abort());
$("#input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}
});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,180)+"px"});
</script>
</body>
</html>
